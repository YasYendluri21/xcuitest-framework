# XcodeGen manifest. The .xcodeproj is a build artifact generated from this file rather than
# committed — a hand-edited pbxproj is the single worst file in any iOS repo to merge.
name: BluDelivery

options:
  bundleIdPrefix: com.bludelivery
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BluDelivery:
    type: application
    platform: iOS
    sources:
      - path: BluDelivery
    info:
      path: BluDelivery/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: BLU Delivery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bludelivery.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  BluDeliveryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BluDeliveryUITests
      # Compiled into both targets on purpose. This is what makes a renamed identifier a compile
      # error in the tests rather than a query that silently stops matching at runtime.
      - path: BluDelivery/Support/AccessibilityIdentifiers.swift
    dependencies:
      - target: BluDelivery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bludelivery.uitests
        TEST_TARGET_NAME: BluDelivery
        # The test bundle has no Info.plist of its own; let the toolchain synthesise one.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BluDelivery:
    build:
      targets:
        BluDelivery: all
        BluDeliveryUITests: [test]
    test:
      targets:
        - BluDeliveryUITests
      gatherCoverageData: false
    run:
      config: Debug
